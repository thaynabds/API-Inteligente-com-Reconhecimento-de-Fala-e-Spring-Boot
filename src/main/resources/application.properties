spring.application.name=budgeting-ai-thayna
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:budgeting}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:budgeting}
spring.datasource.password=${MYSQL_PASSWORD:budgeting}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.model.chat=openai
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=${OPENAI_TRANSCRIPTION_MODEL:whisper-1}

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=${OPENAI_SPEECH_MODEL:gpt-4o-mini-tts}
spring.ai.openai.audio.speech.options.voice=${OPENAI_SPEECH_VOICE:alloy}

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Logging
logging.level.br.com.thaynarbd=INFO
logging.level.org.springframework.ai=WARN
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro com comandos relacionados a gastos, receitas e orçamento financeiro.
spring.ai.openai.audio.speech.options.speed=1.0
spring.ai.openai.audio.speech.options.response-format=mp3
